{{- if eq .Values.expose.type "ingress" }}
{{- if eq (include "harbor.autoGenCertForIngress" .) "true" }}
{{- $host := .Values.expose.ingress.hosts.core }}
{{- $keep := include "harbor.autoTLS.existing" (dict "ctx" . "name" (include "harbor.ingress" .) "host" $host) | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: "{{ template "harbor.ingress" . }}"
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "harbor.labels" . | indent 4 }}
  annotations:
    harbor.goharbor.io/auto-tls-host: {{ $host | quote }}
    harbor.goharbor.io/auto-tls-expires: {{ $keep.expires | default (now | dateModify "+8760h" | unixEpoch) | quote }}
type: kubernetes.io/tls
data:
{{- if $keep }}
  tls.crt: {{ index $keep "tls.crt" | quote }}
  tls.key: {{ index $keep "tls.key" | quote }}
  ca.crt: {{ index $keep "ca.crt" | quote }}
{{- else }}
{{- $ca := genCA "harbor-ca" 365 }}
{{- $cert := genSignedCert $host nil (list $host) 365 $ca }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
{{- end }}
{{- end }}
{{- end }}
