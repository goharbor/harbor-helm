{{- if and (ne .Values.expose.type "ingress") (ne .Values.expose.type "route") (.Values.expose.tls.enabled) }}
{{- if eq (include "harbor.autoGenCertForNginx" .) "true" }}
{{- $cn := (required "The \"expose.tls.auto.commonName\" is required!" .Values.expose.tls.auto.commonName) }}
{{- $keep := include "harbor.autoTLS.existing" (dict "ctx" . "name" (include "harbor.nginx" .) "host" $cn) | fromJson }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ template "harbor.nginx" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
{{ include "harbor.labels" . | indent 4 }}
  annotations:
    harbor.goharbor.io/auto-tls-host: {{ $cn | quote }}
    harbor.goharbor.io/auto-tls-expires: {{ $keep.expires | default (now | dateModify "+8760h" | unixEpoch) | quote }}
type: Opaque
data:
  {{- if $keep }}
  tls.crt: {{ index $keep "tls.crt" | quote }}
  tls.key: {{ index $keep "tls.key" | quote }}
  ca.crt: {{ index $keep "ca.crt" | quote }}
  {{- else }}
  {{- $ca := genCA "harbor-ca" 365 }}
  {{- if regexMatch `^((25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)$` $cn }}
  {{- $cert := genSignedCert $cn (list $cn) nil 365 $ca }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  {{- else }}
  {{- $cert := genSignedCert $cn nil (list $cn) 365 $ca }}
  tls.crt: {{ $cert.Cert | b64enc | quote }}
  tls.key: {{ $cert.Key | b64enc | quote }}
  ca.crt: {{ $ca.Cert | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
