suite: PodDNS

tests:
  - it: nginx omits dnsPolicy and dnsConfig by default
    set:
      expose.type: clusterIP
      expose.tls.enabled: false
    template: templates/nginx/deployment.yaml
    asserts:
      - notExists:
          path: spec.template.spec.dnsPolicy
      - notExists:
          path: spec.template.spec.dnsConfig

  - it: nginx renders dnsPolicy and dnsConfig
    set:
      expose.type: clusterIP
      expose.tls.enabled: false
      nginx.dnsPolicy: ClusterFirst
      nginx.dnsConfig:
        options:
          - name: ndots
            value: "2"
    template: templates/nginx/deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.dnsPolicy
          value: ClusterFirst
      - equal:
          path: spec.template.spec.dnsConfig
          value:
            options:
              - name: ndots
                value: "2"

  - it: portal omits dnsPolicy and dnsConfig by default
    template: templates/portal/deployment.yaml
    asserts:
