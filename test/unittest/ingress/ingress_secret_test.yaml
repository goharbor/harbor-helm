suite: IngressAutoTLS

tests:
  - it: GeneratesACertificateWhenThereIsNoneToKeep
    template: templates/ingress/secret.yaml
    asserts:
      - isNotEmpty:
          path: data["tls.crt"]
      - isNotEmpty:
          path: data["ca.crt"]
      - equal:
          path: metadata.annotations["harbor.goharbor.io/auto-tls-host"]
          value: core.harbor.domain
      - isNotEmpty:
          path: metadata.annotations["harbor.goharbor.io/auto-tls-expires"]

  - it: NginxGeneratesACertificateWhenThereIsNoneToKeep
    set:
      expose:
        type: nodePort
        tls:
          auto:
            commonName: 10.0.0.5
    template: templates/nginx/secret.yaml
    asserts:
      - isNotEmpty:
          path: data["tls.crt"]
      - equal:
          path: metadata.annotations["harbor.goharbor.io/auto-tls-host"]
          value: 10.0.0.5
