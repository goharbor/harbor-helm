suite: PodDisruptionBudget

tests:
  - it: core renders only maxUnavailable when it is set
    set:
      core:
        replicas: 2
        podDisruptionBudget:
          enabled: true
          maxUnavailable: 1
    template: templates/core/core-pdb.yaml
    asserts:
      - equal:
          path: spec.maxUnavailable
          value: 1
      - notExists:
          path: spec.minAvailable

  - it: core renders minAvailable by default
    set:
      core:
        replicas: 2
        podDisruptionBudget:
          enabled: true
    template: templates/core/core-pdb.yaml
    asserts:
      - equal:
          path: spec.minAvailable
          value: 1
      - notExists:
          path: spec.maxUnavailable

  - it: exporter renders only maxUnavailable when it is set
